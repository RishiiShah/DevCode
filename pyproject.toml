[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "devcode"
description = "Coding-agent harness: minimal, verified, reversible changes"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = ["Programming Language :: Rust", "Environment :: Console"]

[project.urls]
Repository = "https://github.com/RishiiShah/DevCode"

[tool.maturin]
# Ships the Rust binary as a script: `pip install devcode` or `pipx install devcode` puts `devcode` on PATH.
bindings = "bin"
